name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: bash ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvos-home-apk
          path: build/tvos-home.apk
          if-no-files-found: error
